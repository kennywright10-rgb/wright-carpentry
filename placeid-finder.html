<!DOCTYPE html>
<html><head><title>Place ID Finder</title></head>
<body>
<pre id="out">Searching...</pre>
<script>
var KEY = 'AIzaSyDKs9oFCOnBK44nJGq-kwFfHqyGT5FRKOg';

// Try REST findplacefromtext with phone number
fetch('https://maps.googleapis.com/maps/api/place/findplacefromtext/json'
  + '?input=%28530%29+391-0206&inputtype=phonenumber&fields=place_id%2Cname%2Cformatted_address&key=' + KEY)
  .then(function(r){return r.json();})
  .then(function(d){
    var out = document.getElementById('out');
    out.textContent += 'Phone lookup: ' + d.status + '\n';
    if(d.candidates) d.candidates.forEach(function(c){
      out.textContent += '  ' + c.name + ' | ' + c.formatted_address + '\n  Place ID: ' + c.place_id + '\n';
    });

    // Also try text search
    return fetch('https://maps.googleapis.com/maps/api/place/textsearch/json'
      + '?query=Wright+Carpentry+95726&key=' + KEY);
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var out = document.getElementById('out');
    out.textContent += '\nText search: ' + d.status + '\n';
    if(d.results) d.results.forEach(function(r){
      out.textContent += '  ' + r.name + ' | ' + r.formatted_address + '\n  Place ID: ' + r.place_id + '\n';
    });
  });
</script>
</body></html>
