<!DOCTYPE html>
<html><head><title>Place ID Finder</title></head>
<body>
<pre id="out">Looking up...</pre>
<div id="map" style="position:fixed;top:-9999px;left:-9999px;width:200px;height:200px;"></div>
<script>
function init(){
  var svc = new google.maps.places.PlacesService(document.getElementById('map'));
  svc.getDetails({
    placeId: '/g/11zgw2lp17',
    fields: ['place_id','name','formatted_address','reviews']
  }, function(place, status){
    var out = document.getElementById('out');
    if(status === 'OK' && place){
      out.textContent = 'Name: ' + place.name + '\n'
        + 'Address: ' + place.formatted_address + '\n'
        + 'Place ID: ' + place.place_id + '\n'
        + 'Reviews: ' + (place.reviews ? place.reviews.length : 0);
    } else {
      out.textContent = 'Status: ' + status;
    }
  });
}
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDKs9oFCOnBK44nJGq-kwFfHqyGT5FRKOg&libraries=places&callback=init"></script>
</body></html>
