<!DOCTYPE html>
<html><head><title>Place ID Finder</title></head>
<body>
<pre id="out">Trying multiple CID formats...</pre>
<script>
var KEY = 'AIzaSyDKs9oFCOnBK44nJGq-kwFfHqyGT5FRKOg';
var cids = [
  '3053071123531868928',
  '18188781412358541578'
];
var out = document.getElementById('out');

function tryNext(i){
  if(i>=cids.length){out.textContent+='All done.';return;}
  fetch('https://maps.googleapis.com/maps/api/geocode/json?place_id=cid:'+cids[i]+'&key='+KEY)
    .then(function(r){return r.json();})
    .then(function(d){
      out.textContent += 'CID '+cids[i]+': '+d.status+'\n';
      if(d.results&&d.results[0]){
        out.textContent += '  Place ID: '+d.results[0].place_id+'\n';
        out.textContent += '  Address: '+d.results[0].formatted_address+'\n';
      }
      tryNext(i+1);
    });
}
tryNext(0);
</script>
</body></html>
