<!DOCTYPE html>
<html>
<head><title>Place ID Finder</title></head>
<body>
<h2 id="out">Searching...</h2>
<div id="map" style="position:fixed;top:-9999px;left:-9999px;width:200px;height:200px;"></div>
<script>
function init(){
  var svc=new google.maps.places.PlacesService(document.getElementById('map'));
  svc.textSearch({
    query:'Wright Carpentry',
    location:new google.maps.LatLng(38.784919,-120.5437558),
    radius:2000
  },function(results,status){
    if(status==='OK'){
      var out='<ul>';
      results.forEach(function(r){
        out+='<li><b>'+r.name+'</b><br>'+r.formatted_address+'<br>Place ID: <code>'+r.place_id+'</code></li><br>';
      });
      document.getElementById('out').innerHTML=out+'</ul>';
    } else {
      document.getElementById('out').textContent='Status: '+status;
    }
  });
}
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDKs9oFCOnBK44nJGq-kwFfHqyGT5FRKOg&libraries=places&callback=init"></script>
</body>
</html>
